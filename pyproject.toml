[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glpi-agents"
version = "0.1.0"
description = "MCP server over GLPI 11.0.12 and the onboarding / inventory agents built on it"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",          # MCP Python SDK: server over streamable HTTP
  "httpx>=0.27",       # GLPI client
  "pydantic>=2.6",     # tool schemas and the answer envelope
  "pyyaml>=6.0.1",     # the brain
  "openpyxl>=3.1",     # workbook intake (cell types preserved)
  "anthropic>=0.40",   # the agents' model
  "uvicorn>=0.30",     # HTTP serving for the MCP server
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
